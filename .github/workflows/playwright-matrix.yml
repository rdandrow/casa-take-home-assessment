name: Playwright Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Baseline
            command: npm run test:baseline -- --project=chromium --reporter=line
          - name: Bug Docs
            command: npm run test:bugs -- --project=chromium --reporter=line

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.suite.name }}
        run: ${{ matrix.suite.command }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite.name }}-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
